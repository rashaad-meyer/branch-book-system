services:
  db:
    image: postgres:16-alpine
    container_name: branch-booking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: branch_booking
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d branch_booking']
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies pending migrations, then exits. Uses the build stage,
  # which has the prisma CLI. Re-run for seeding:
  #   docker compose run --rm migrate npx prisma db seed
  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: build
    working_dir: /app/server
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/branch_booking
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/branch_booking
      # Dev-only default; override via environment for anything real.
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 4000
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/v1/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
