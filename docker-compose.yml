services:
  db:
    image: postgres:16-alpine
    container_name: branch-booking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: branch_booking
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d branch_booking']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
